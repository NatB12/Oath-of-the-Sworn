<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oath of the Sworn</title>
<link rel="stylesheet" href="./css2">
<style>
:root{--bg:#15181b;--panel:#1e2327;--line:#3a3f42;--bone:#ddd5c2;--dim:#8d8779;--blood:#a23a3f;--brass:#b09257;--steel:#7b97a4;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:radial-gradient(ellipse at 50% -10%,#262c30 0%,var(--bg) 60%) fixed;color:var(--bone);font:19px/1.65 "IM Fell English",Georgia,serif;min-height:100vh}
main{max-width:660px;margin:0 auto;padding:28px 20px 60px}
h1,h2,h3{font-family:Cinzel,Georgia,serif;font-weight:600;letter-spacing:.04em;margin:0}
h1{font-size:2.4rem;text-align:center;color:var(--brass);margin-top:30px}
h3{font-size:1.05rem}
.sub{text-align:center;color:var(--dim);font-style:italic;margin:.4em 0 2em}
p{margin:0 0 1.1em;max-width:62ch}
button{font:inherit;color:var(--bone);background:var(--panel);border:1px solid var(--line);padding:.6em 1em;cursor:pointer;text-align:left;border-radius:2px}
button:hover:not(:disabled){border-color:var(--brass)}
button:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
input{font:inherit;color:var(--bone);background:var(--bg);border:1px solid var(--line);padding:.5em .7em;width:100%;margin:.3em 0 1.4em;border-radius:2px}
.cls{display:grid;gap:12px;margin-bottom:1.6em}
.card{display:block;width:100%}
.card.on{border-color:var(--brass);box-shadow:inset 3px 0 0 var(--brass)}
.card small{display:block;color:var(--dim);font-style:italic}
.card ul{margin:.5em 0 0;padding-left:1.1em;font-size:.85em;color:var(--dim)}
.card li i{color:var(--bone)}
.go{background:var(--blood);border-color:var(--blood);text-align:center;width:100%;font-family:Cinzel,serif;letter-spacing:.06em}
.hdr{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:24px;font-size:.85em;color:var(--dim)}
.hdr b{color:var(--bone);font-family:Cinzel,serif;font-weight:600}
.bar{height:6px;background:#0c0e10;border:1px solid var(--line);width:110px;display:inline-block;vertical-align:middle;margin-left:6px}
.bar i{display:block;height:100%;background:var(--blood)}
.choices{display:grid;gap:10px;margin-top:1.6em}
.fight{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:1.2em 0}
.side{background:var(--panel);border:1px solid var(--line);padding:12px 14px;font-size:.9em}
.side .bar{display:block;width:100%;margin:6px 0}
.tags{color:var(--steel);min-height:1.5em;font-style:italic}
.abil{display:grid;gap:8px;margin:14px 0}
.abil small{color:var(--dim);display:block}
.log{border-left:2px solid var(--line);padding-left:12px;color:var(--dim);font-size:.9em;min-height:5em}
.log p{margin:0 0 .3em}.log p:last-child{color:var(--bone)}
.end{border-top:1px solid var(--brass);padding-top:14px;color:var(--dim)}
@media(max-width:520px){.fight{grid-template-columns:1fr}h1{font-size:1.9rem}}
</style>
</head>
<body>
<main id="main"><h1>Oath of the Sworn</h1>
  <p class="sub">The kingdom is falling. You swore an oath. What was it worth?</p>
  <label for="nm">Your name</label><input id="nm" maxlength="20" placeholder="Sir or Dame..." value="">
  <div class="cls">
    <button class="card" data-a="pick" data-v="shield"><b>Shieldsworn</b>
    <small>Endure. Let the enemy break upon you.</small>
    <ul><li><i>Shield Bash</i> (1 guard): 2 dmg</li><li><i>Brace</i> (2 guard): reduce next damage you take by 4</li><li><i>Shove</i> (3 guard): enemy loses 2 resource on their next turn</li></ul></button>
    <button class="card on" data-a="pick" data-v="blade"><b>Bladesworn</b>
    <small>Strike first, strike hard.</small>
    <ul><li><i>Slash</i> (1 momentum): 3 dmg</li><li><i>Lunge</i> (2 momentum): 5 dmg, but you take 2 more when next attacked</li><li><i>Riposte</i> (3 momentum): until your next turn, attackers take 4 dmg</li></ul></button>
    <button class="card" data-a="pick" data-v="spell"><b>Spellsworn</b>
    <small>Steel and sorcery, sworn together.</small>
    <ul><li><i>Arcane Blade</i> (2 mana): 4 dmg</li><li><i>Bind</i> (2 mana): enemy cannot use abilities costing more than 2 until your next turn</li><li><i>Blink</i> (2 mana): ignore the enemy's next attack</li></ul></button>
  </div>
  <button class="go" data-a="begin">Swear the oath</button></main>
<script>
/* ============ ABILITIES & CLASSES ============ */
const AB = {
  bash:   {name:'Shield Bash', cost:1, desc:'2 dmg', run:(S,F,c)=>c.atk(2)},
  brace:  {name:'Brace', cost:2, desc:'reduce next damage you take by 4', run:(S,F,c)=>{S.brace=true;c.log(`${S.name} braces behind the shield.`)}},
  shove:  {name:'Shove', cost:3, desc:'enemy loses 2 resource on their next turn', run:(S,F,c)=>{F.shove=true;c.log(`${S.name} shoves ${F.name} off balance.`)}},
  slash:  {name:'Slash', cost:1, desc:'3 dmg', run:(S,F,c)=>c.atk(3)},
  lunge:  {name:'Lunge', cost:2, desc:'5 dmg, but you take 2 more when next attacked', run:(S,F,c)=>{c.atk(5);S.vuln=true}},
  riposte:{name:'Riposte', cost:3, desc:'until your next turn, attackers take 4 dmg', run:(S,F,c)=>{S.riposte=true;c.log(`${S.name} waits for an opening.`)}},
  arcane: {name:'Arcane Blade', cost:2, desc:'4 dmg', run:(S,F,c)=>c.atk(4)},
  bind:   {name:'Bind', cost:2, desc:'enemy cannot use abilities costing more than 2 until your next turn', run:(S,F,c)=>{F.bound=true;c.log(`Threads of light bind ${F.name}.`)}},
  blink:  {name:'Blink', cost:2, desc:'ignore the enemy\'s next attack', run:(S,F,c)=>{S.blink=true;c.log(`${S.name} flickers at the edge of sight.`)}}
};
const CLASSES = {
  shield:{name:'Shieldsworn', res:'Guard', blurb:'Endure. Let the enemy break upon you.', ab:['bash','brace','shove']},
  blade: {name:'Bladesworn', res:'Momentum', blurb:'Strike first, strike hard.', ab:['slash','lunge','riposte']},
  spell: {name:'Spellsworn', res:'Mana', blurb:'Steel and sorcery, sworn together.', ab:['arcane','bind','blink']}
};

/* ============ STORY (edit dialogue here) ============ */
const STORY = {
  start:'camp',
  // Character objects, ready for later chapters
  characters:{
    player:{items:['Sword','Oath token']},
    elara:{items:['Crown','Signet ring'], note:'Crown and signet grant access you would otherwise lack.'},
    garran:{items:['Sword of rank','Seal'], note:'Fights with or against you.'}
  },
  scenes:{
    camp:{
      text:[
        "The fire burns down to embers as you stare at the night sky, having long since abandoned the idea of sleep.",
        "The past few days have been long and arduous, a constant dance between death and dishonor. You think back to the kingdom and its untimely fate, and grip your oath token, wondering what it was all for.",
        "In the quiet, it is easy to hear a blade slip from its scabbard, the ringing metal echoing in the trees.",
        "\"Your money or your life, knight.\" A man in battered armor steps into the light, blade at the ready."
      ],
      choices:[{label:"Draw your sword", next:'fight'}]
    },
    fight:{
      text:["The bandit lunges out of the shadows."],
      combat:{enemy:{name:'Bandit', hp:8, res:4, ab:['slash','lunge','riposte']}, win:'surrender', lose:'defeat'}
    },
    surrender:{
      text:[
        "The bandit staggers and drops to one knee, his sword falling in the dirt.",
        "\"Enough! I yield. Please.\"",
        "He watches your blade. You feel the weight of the token at your neck, and of the oath it stands for."
      ],
      choices:[
        {label:"Execute the bandit", next:'execute', do:{garran:2}},
        {label:"Take his weapons and gold, then let him go", next:'spare', do:{elara:1, items:["Bandit's blade","Bandit's gold"]}},
        {label:"Interrogate him", next:'interrogate', do:{flag:'knowsDeserter'}}
      ]
    },
    execute:{
      text:["You end it quickly. The forest swallows the sound.","Afterward you sit by the ashes and wonder whether the order would call that justice."],
      choices:[{label:"Continue", next:'end'}]
    },
    spare:{
      text:["You strip him of his blade and his coin. He does not thank you as he limps away into the trees.","You wonder whether mercy was strength or weakness."],
      choices:[{label:"Continue", next:'end'}]
    },
    interrogate:{
      text:[
        "Under your questions the bandit's story unravels. He was not always a bandit.",
        "\"I swore the same oath you did. I served in the order. Then I saw what we were ordered to do, and I ran.\"",
        "He is a deserter of your own order. His hand shakes toward his collar, where an order token hangs, dulled with neglect."
      ],
      choices:[
        {label:"Let him go", next:'spare2', do:{elara:1}},
        {label:"Judge him as an oathbreaker", next:'execute', do:{garran:2}}
      ]
    },
    spare2:{
      text:["You lower your sword. The deserter looks at you as if unsure whether to trust it, then vanishes into the dark."],
      choices:[{label:"Continue", next:'end'}]
    },
    defeat:{
      text:["The world tilts and darkens. Your oath goes unfulfilled."],
      choices:[{label:"Rise and try again", next:'camp', do:{reset:true}}]
    },
    end:{
      text:g=>[
        "Dawn comes gray over the trees. Whatever you chose tonight, the road ahead is still there.",
        g.garran>g.elara ? "Garran would approve of what you did. That thought is not as comforting as it should be." :
        g.elara>g.garran ? "Elara would understand what you did. Garran would not." :
        "Neither Elara nor Garran would know what to make of you.",
        g.flags.knowsDeserter ? "You know now that the order has deserters. You cannot un-know it." : "You do not know what drove the bandit to the road."
      ],
      choices:[{label:"Begin again", next:'__title'}],
      ending:true
    }
  }
};

/* ============ ENGINE ============ */
const $ = s => document.querySelector(s);
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const main = h => { $('#main').innerHTML = h; window.scrollTo(0,0); };
let G = null, C = null, pickClass = 'blade';

function fmt(p){ return esc(typeof p==='string'?p:'').replace(/\{name\}/g, esc(G.name)); }
const bar = (v,m) => `<span class="bar"><i style="width:${Math.max(0,v)/m*100}%"></i></span>`;

function header(){
  return `<div class="hdr"><span><b>${esc(G.name)}</b>, ${CLASSES[G.cls].name}</span><span>HP ${G.hp}/${G.max}${bar(G.hp,G.max)}</span><span>Carrying: ${G.items.map(esc).join(', ')}</span></div>`;
}

function showTitle(){
  main(`<h1>Oath of the Sworn</h1>
  <p class="sub">The kingdom is falling. You swore an oath. What was it worth?</p>
  <label for="nm">Your name</label><input id="nm" maxlength="20" placeholder="Sir or Dame..." value="">
  <div class="cls">${Object.entries(CLASSES).map(([k,c])=>`
    <button class="card${k===pickClass?' on':''}" data-a="pick" data-v="${k}"><b>${c.name}</b>
    <small>${c.blurb}</small>
    <ul>${c.ab.map(id=>`<li><i>${AB[id].name}</i> (${AB[id].cost} ${c.res.toLowerCase()}): ${AB[id].desc}</li>`).join('')}</ul></button>`).join('')}
  </div>
  <button class="go" data-a="begin">Swear the oath</button>`);
}

function newGame(){
  const name = ($('#nm')?.value || '').trim() || 'Ser Unnamed';
  G = {name, cls:pickClass, hp:10, max:10, items:['Sword','Oath token'], elara:0, garran:0, flags:{}};
  go(STORY.start);
}

function go(id){
  if(id==='__title') return showTitle();
  const s = STORY.scenes[id]; G.scene = id;
  const paras = (typeof s.text==='function' ? s.text(G) : s.text);
  const body = paras.map(p=>`<p>${fmt(p)}</p>`).join('');
  if(s.combat) return startCombat(s, body);
  main(header() + body + `<div class="choices">${s.choices.map((c,i)=>`<button data-a="choose" data-v="${i}">${esc(c.label)}</button>`).join('')}</div>` + (s.ending?`<p class="end">Playtest complete. Elara's mercy: ${G.elara}. Garran's law: ${G.garran}.</p>`:''));
}

function choose(i){
  const c = STORY.scenes[G.scene].choices[i], d = c.do || {};
  if(d.reset){ G.hp=G.max; G.elara=0; G.garran=0; G.flags={}; G.items=['Sword','Oath token']; }
  if(d.elara) G.elara += d.elara;
  if(d.garran) G.garran += d.garran;
  if(d.items) G.items.push(...d.items);
  if(d.flag) G.flags[d.flag] = true;
  go(c.next);
}

/* ============ COMBAT ============ */
function startCombat(s, intro){
  const e = s.combat.enemy, cl = CLASSES[G.cls];
  C = {sc:s.combat, intro, turn:'p', over:false, won:false, logs:[], first:{p:true,e:true},
    p:{name:G.name, hp:G.hp, max:G.max, res:4, ab:cl.ab, resName:cl.res},
    e:{name:e.name, hp:e.hp, max:e.hp, res:e.res, ab:e.ab, resName:'Momentum'}};
  C.log = t => C.logs.push(t);
  C.log(`${e.name} attacks! Your ${cl.res.toLowerCase()} is 4.`);
  drawCombat();
}

function act(side, id){
  const S = C[side], F = C[side==='p'?'e':'p'], a = AB[id];
  S.res -= a.cost;
  C.log(`${S.name} uses ${a.name}.`);
  const ctx = {log:C.log, atk:n=>hit(S,F,n,false)};
  a.run(S,F,ctx);
}

function hit(A,T,base,counter){
  let d = base;
  if(T.vuln){ d+=2; T.vuln=false; }
  if(T.blink){ T.blink=false; d=0; C.log(`${T.name} ignores the blow entirely.`); }
  else {
    if(T.brace && d>0){ d=Math.max(0,d-4); T.brace=false; }
    T.hp = Math.max(0, T.hp-d);
    C.log(`${T.name} takes ${d} damage.`);
  }
  if(!counter && T.riposte){ C.log(`${T.name} strikes back with a riposte!`); hit(T,A,4,true); }
}

function afterAction(){
  G.hp = C.p.hp;
  if(C.e.hp<=0){ C.over=true; C.won=true; C.log(`${C.e.name} falls to their knees and yields.`); }
  else if(C.p.hp<=0){ C.over=true; C.log(`You collapse.`); }
  if(!C.over) return false;
  return true;
}

function playerAct(id){
  if(C.turn!=='p' || C.over) return;
  if(id) act('p', id); else C.log(`${C.p.name} catches their breath.`);
  if(afterAction()) return drawCombat();
  C.turn='e'; drawCombat();
  setTimeout(enemyTurn, 850);
}

function enemyTurn(){
  const e = C.e, p = C.p;
  e.riposte = false;
  if(C.first.e) C.first.e=false; else e.res += 2;
  if(e.shove){ e.res=Math.max(0,e.res-2); e.shove=false; C.log(`${e.name} is off balance and loses 2 ${e.resName.toLowerCase()}.`); }
  const opts = e.ab.filter(id => AB[id].cost<=e.res && !(e.bound && AB[id].cost>2));
  if(!opts.length) C.log(`${e.name} has nothing left to try.`);
  else {
    const id = (opts.includes('lunge') && p.hp<=5) ? 'lunge' : opts[Math.floor(Math.random()*opts.length)];
    act('e', id);
  }
  if(afterAction()) return drawCombat();
  // start of player's next turn
  C.turn='p'; p.res += 2; p.riposte=false; e.bound=false;
  drawCombat();
}

const tags = x => [x.brace&&'Braced', x.vuln&&'Exposed (+2 dmg)', x.blink&&'Blink ready', x.riposte&&'Riposte set', x.bound&&'Bound', x.shove&&'Off balance'].filter(Boolean).join(', ') || '&nbsp;';

function drawCombat(){
  const {p,e} = C;
  let controls;
  if(C.over){
    controls = `<div class="choices"><button data-a="endfight">${C.won?'Continue':'Continue'}</button></div>`;
  } else {
    controls = `<div class="abil">${p.ab.map(id=>`<button data-a="use" data-v="${id}" ${(C.turn!=='p'||p.res<AB[id].cost)?'disabled':''}>${AB[id].name} <small>${AB[id].cost} ${p.resName.toLowerCase()}: ${AB[id].desc}</small></button>`).join('')}
    <button data-a="use" data-v="" ${C.turn!=='p'?'disabled':''}>Catch your breath <small>do nothing this turn</small></button></div>`;
  }
  main(header() + C.intro + `<div class="fight">
    <div class="side"><h3>${esc(p.name)}</h3>${bar(p.hp,p.max)}<div>${p.resName} ${p.res}</div><div class="tags">${tags(p)}</div></div>
    <div class="side"><h3>${esc(e.name)}</h3>${bar(e.hp,e.max)}<div>HP ${e.hp}/${e.max}, ${e.resName} ${e.res}</div><div class="tags">${tags(e)}</div></div></div>`
    + controls + `<div class="log" aria-live="polite">${C.logs.slice(-7).map(l=>`<p>${esc(l)}</p>`).join('')}</div>`);
}

/* ============ EVENTS ============ */
const actions = {
  pick(v,b){ pickClass=v; document.querySelectorAll('.card').forEach(c=>c.classList.toggle('on',c===b)); },
  begin: newGame,
  choose,
  use: v => playerAct(v),
  endfight(){ go(C.won ? C.sc.win : C.sc.lose); }
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if(b && !b.disabled) actions[b.dataset.a](b.dataset.v, b);
});
showTitle();
</script>


</body></html>
